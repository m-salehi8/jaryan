version: "3.9"

services:
  # ─────────────────────────────
  # MongoDB
  # ─────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: jaryan_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: jaryan
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"   # optional: remove if you don't need direct host access
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────
  # PostgreSQL
  # ─────────────────────────────
  db:
    image: postgres:15
    container_name: jaryan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jaryan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────
  # Redis (Message Broker for Celery)
  # ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jaryan_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────
  # Backend (Django + Gunicorn)
  # ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaryan_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: jaryan.settings
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: jaryan
      DB_HOST: db
      DB_NAME: jaryan
      DB_USER: postgres
      DB_PASS: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"     # optional: remove if backend is only accessed via nginx
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─────────────────────────────
  # Celery Worker
  # ─────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaryan_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "jaryan", "worker", "-l", "info"]
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: jaryan.settings
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: jaryan
      DB_HOST: db
      DB_NAME: jaryan
      DB_USER: postgres
      DB_PASS: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy

  # ─────────────────────────────
  # Celery Beat
  # ─────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaryan_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "jaryan", "beat", "-l", "info"]
    env_file:
      - ./backend/.env
    environment:
      DJANGO_SETTINGS_MODULE: jaryan.settings
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB_NAME: jaryan
      DB_HOST: db
      DB_NAME: jaryan
      DB_USER: postgres
      DB_PASS: postgres
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────
  # Frontend (React → Nginx)
  # ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string → API_BASE = "/api" — nginx proxies /api/* to the backend service
        # If you expose the app behind a domain, you can also set this to your full domain:
        # REACT_APP_BACKEND_URL: "https://jaryan.example.com"
        REACT_APP_BACKEND_URL: ""
    container_name: jaryan_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
  postgres_data:
    driver: local
