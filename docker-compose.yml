version: "3.9"

services:
  # ─────────────────────────────
  # MongoDB
  # ─────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: jaryan_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: jaryan
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"   # optional: remove if you don't need direct host access
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────
  # Backend (FastAPI)
  # ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jaryan_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: jaryan
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8000:8000"     # optional: remove if backend is only accessed via nginx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────
  # Frontend (React → Nginx)
  # ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string → API_BASE = "/api" — nginx proxies /api/* to the backend service
        # If you expose the app behind a domain, you can also set this to your full domain:
        # REACT_APP_BACKEND_URL: "https://jaryan.example.com"
        REACT_APP_BACKEND_URL: ""
    container_name: jaryan_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
